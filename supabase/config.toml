# Local Supabase configuration for the Tuition Payment Website.
# This file contains no project credentials and is safe to commit.
project_id = "tuition-payment-website"

[api]
enabled = true
port = 54321
schemas = ["public", "auth_svc", "user_svc", "studentfee_svc", "payment_svc"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# The application implements its own account table and JWT flow.
[auth]
enabled = false

